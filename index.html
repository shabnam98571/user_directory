<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Directory</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>
          <lord-icon
            src="https://cdn.lordicon.com/kthelypq.json"
            trigger="hover"
            style="width: 50px; height: 50px"
          >
          </lord-icon>
          User Directory
        </h1>
        <p>Find and manage users easily</p>
      </header>

      <div class="search-container">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search users by name or email..."
        />
      </div>

      <div id="usersContainer" class="users-grid">
        <!-- Users will be loaded here -->
      </div>

      <div class="pagination">
        <button id="prevBtn" disabled>Previous</button>
        <span class="page-info" id="pageInfo">Page 1 of 1</span>
        <button id="nextBtn" disabled>Next</button>
      </div>
    </div>

    <!-- User Detail Modal -->
    <div id="userModal" class="modal">
      <div class="modal-content">
        <button class="close-btn" id="closeModal">&times;</button>
        <div id="userDetail" class="user-detail">
          <!-- User details will be loaded here -->
        </div>
      </div>
    </div>

    <script>
      class UserDirectory {
        constructor() {
          this.currentPage = 1;
          this.limit = 9;
          this.searchTerm = "";
          this.totalPages = 1;

          this.initializeElements();
          this.attachEventListeners();
          this.loadUsers();
        }

        initializeElements() {
          this.usersContainer = document.getElementById("usersContainer");
          this.searchInput = document.getElementById("searchInput");
          this.prevBtn = document.getElementById("prevBtn");
          this.nextBtn = document.getElementById("nextBtn");
          this.pageInfo = document.getElementById("pageInfo");
          this.userModal = document.getElementById("userModal");
          this.userDetail = document.getElementById("userDetail");
          this.closeModal = document.getElementById("closeModal");
        }

        attachEventListeners() {
          this.searchInput.addEventListener(
            "input",
            this.debounce(() => {
              this.searchTerm = this.searchInput.value;
              this.currentPage = 1;
              this.loadUsers();
            }, 300)
          );

          this.prevBtn.addEventListener("click", () => {
            if (this.currentPage > 1) {
              this.currentPage--;
              this.loadUsers();
            }
          });

          this.nextBtn.addEventListener("click", () => {
            if (this.currentPage < this.totalPages) {
              this.currentPage++;
              this.loadUsers();
            }
          });

          this.closeModal.addEventListener("click", () => {
            this.userModal.style.display = "none";
          });

          window.addEventListener("click", (e) => {
            if (e.target === this.userModal) {
              this.userModal.style.display = "none";
            }
          });
        }

        debounce(func, wait) {
          let timeout;
          return function executedFunction(...args) {
            const later = () => {
              clearTimeout(timeout);
              func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
          };
        }

        async loadUsers() {
          try {
            this.showLoading();

            const params = new URLSearchParams({
              page: this.currentPage,
              limit: this.limit,
              ...(this.searchTerm && { search: this.searchTerm }),
            });

            const response = await fetch(
              `http://localhost:5000/users?${params}`
            );

            if (!response.ok) {
              throw new Error("Failed to fetch users");
            }

            const data = await response.json();

            this.totalPages = data.totalPages;
            this.renderUsers(data.users);
            this.updatePagination(data);
          } catch (error) {
            this.showError("Failed to load users: " + error.message);
          }
        }

        showLoading() {
          this.usersContainer.innerHTML =
            '<div class="loading">Loading users...</div>';
        }

        showError(message) {
          this.usersContainer.innerHTML = `
              <div class="error">${message}</div>
            `;
        }

        renderUsers(users) {
          if (users.length === 0) {
            this.usersContainer.innerHTML =
              '<div class="loading">No users found matching your search.</div>';
            return;
          }

          this.usersContainer.innerHTML = users
            .map(
              (user) => `
          <div class="user-card" onclick="userDirectory.showUserDetail(${user.id})">

              <div class="user-name">${user.name}</div>

              <div class="user-email">
                  <lord-icon src="https://cdn.lordicon.com/ayhtotha.json" trigger="hover" style="width:25px;height:25px"></lord-icon>
                  ${user.email}
              </div>

              <div class="user-phone">
                  <lord-icon src="https://cdn.lordicon.com/srsgifqc.json" trigger="hover" style="width:25px;height:25px"></lord-icon>
                  ${user.phone}
              </div>

              <div class="user-city">
                  <lord-icon src="https://cdn.lordicon.com/zzcjjxew.json" trigger="hover" style="width:25px;height:25px"></lord-icon>
                  ${user.city}
              </div>

          </div>
        `
            )
            .join("");
        }

        updatePagination(data) {
          this.pageInfo.textContent = `Page ${data.currentPage} of ${data.totalPages}`;
          this.prevBtn.disabled = !data.hasPrev;
          this.nextBtn.disabled = !data.hasNext;
        }

        async showUserDetail(userId) {
          try {
            const response = await fetch(
              `http://localhost:5000/users/${userId}`
            );

            if (!response.ok) {
              throw new Error("Failed to fetch user details");
            }

            const user = await response.json();
            this.renderUserDetail(user);
            this.userModal.style.display = "block";
          } catch (error) {
            alert("Failed to load user details: " + error.message);
          }
        }

        renderUserDetail(user) {
          this.userDetail.innerHTML = `
              <h2>User Details</h2>

              <div class="detail-item">
                <lord-icon src="https://cdn.lordicon.com/kthelypq.json" trigger="hover" style="width:30px;height:30px"></lord-icon>
                <span class="detail-label">Name:</span> ${user.name}
              </div>

              <div class="detail-item">
                <lord-icon src="https://cdn.lordicon.com/ayhtotha.json" trigger="hover" style="width:30px;height:30px"></lord-icon>
                <span class="detail-label">Email:</span> ${user.email}
              </div>

              <div class="detail-item">
                <lord-icon src="https://cdn.lordicon.com/srsgifqc.json" trigger="hover" style="width:30px;height:30px"></lord-icon>
                <span class="detail-label">Phone:</span> ${user.phone}
              </div>

              <div class="detail-item">
                <lord-icon src="https://cdn.lordicon.com/zzcjjxew.json" trigger="hover" style="width:30px;height:30px"></lord-icon>
                <span class="detail-label">Address:</span><br>
                ${user.address.street}<br>
                ${user.address.city}, ${user.address.zipcode}
              </div>
            `;
        }
      }

      const userDirectory = new UserDirectory();
    </script>

    <script src="https://cdn.lordicon.com/lordicon.js"></script>
  </body>
</html>
